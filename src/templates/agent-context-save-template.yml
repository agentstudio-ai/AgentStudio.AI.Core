---
# AgentStudio.AI Agent Context Save Template
# Template for structured agent context saving

version: "1.0.0"
template_type: "agent_context_save_template"
created: "2025-01-25"
modified: "2025-01-25"
description: |
  Structured template for agent context saving to ensure consistent
  state management

# Template Variables for Context Saving
# {AGENT_ID} - Unique identifier for this agent instance
# {AGENT_ROLE} - Role of the agent (e.g., "Backend Engineer", "Product Manager")
# {WORKFLOW_ID} - Current workflow identifier
# {SESSION_ID} - Current session identifier
# {TIMESTAMP} - When context was saved

agent_context:
  metadata:
    agent_id: "{AGENT_ID}"
    agent_role: "{AGENT_ROLE}"
    agent_type: "{AGENT_TYPE}" # e.g., "department", "domain", "ai_expert"
    workflow_id: "{WORKFLOW_ID}"
    session_id: "{SESSION_ID}"
    context_version: "1.0.0"
    saved_at: "{TIMESTAMP}"
    context_type: | # e.g., "work_in_progress", "completed", "paused"
      "{CONTEXT_TYPE}"

  agent_state:
    current_task: "{CURRENT_TASK}"
    current_phase: | # e.g., "analysis", "implementation", "review"
      "{CURRENT_PHASE}"
    progress_percentage: "{PROGRESS_PERCENTAGE}"
    status: "{STATUS}" # e.g., "active", "blocked", "waiting", "completed"

  work_context:
    deliverables:
      completed:
        - "{COMPLETED_DELIVERABLE_1}"
        - "{COMPLETED_DELIVERABLE_2}"
      in_progress:
        - "{IN_PROGRESS_DELIVERABLE_1}"
        - "{IN_PROGRESS_DELIVERABLE_2}"
      pending:
        - "{PENDING_DELIVERABLE_1}"
        - "{PENDING_DELIVERABLE_2}"

    decisions_made:
      - | # e.g., "Chose microservices architecture"
        "{DECISION_1}"
      - | # e.g., "Selected PostgreSQL database"
        "{DECISION_2}"

    blockers:
      - | # e.g., "Waiting for API specification"
        "{BLOCKER_1}"
      - | # e.g., "Database migration pending"
      - "{BLOCKER_2}"

    risks:
      - | # e.g., "Performance may not meet targets"
        "{RISK_1}"
      - | # e.g., "Integration complexity underestimated"
        "{RISK_2}"

  collaboration_state:
    handoffs_pending:
      - | # e.g., "Ready to handoff to QA team"
        "{HANDOFF_1}"
      - | # e.g., "Waiting for architecture review"
        "{HANDOFF_2}"

    feedback_received:
      - | # e.g., "Code review feedback from senior engineer"
        "{FEEDBACK_1}"
      - | # e.g., "Performance optimization suggestions"
        "{FEEDBACK_2}"

    next_actions:
      - | # e.g., "Implement authentication service"
        "{NEXT_ACTION_1}"
      - | # e.g., "Write unit tests for new endpoints"
        "{NEXT_ACTION_2}"

    dependencies:
      - | # e.g., "Database schema must be ready"
        "{DEPENDENCY_1}"
      - | # e.g., "API contracts approved"
        "{DEPENDENCY_2}"

  quality_metrics:
    code_quality: | # e.g., "GOOD", "NEEDS_IMPROVEMENT", "EXCELLENT"
      "{CODE_QUALITY}"
    test_coverage: | # e.g., "85%", "60%", "95%"
      "{TEST_COVERAGE}"
    performance: | # e.g., "MEETS_TARGETS", "BELOW_TARGETS", "EXCEEDS_TARGETS"
      "{PERFORMANCE}"

    issues_found:
      - | # e.g., "Memory leak in authentication service"
        "{ISSUE_1}"
      - | # e.g., "Slow database queries"
        "{ISSUE_2}"

    issues_resolved:
      - | # e.g., "Fixed null reference exception"
        "{RESOLVED_ISSUE_1}"
      - | # e.g., "Optimized database queries"
        "{RESOLVED_ISSUE_2}"

  timeline_context:
    original_estimate: | # e.g., "5 days"
      "{ORIGINAL_ESTIMATE}"
    current_estimate: | # e.g., "7 days"
      "{CURRENT_ESTIMATE}"
    variance_reason: | # e.g., "Additional complexity discovered"
      "{VARIANCE_REASON}"
    milestone_dates:
      - "{MILESTONE_1}" # e.g., "Implementation: 2025-01-28"
      - "{MILESTONE_2}" # e.g., "Testing: 2025-01-30"
      - "{MILESTONE_3}" # e.g., "Deployment: 2025-02-01"

  domain_specific_context:
    # This section varies by agent type
    # For Backend Engineer:
    technical_stack: | # e.g., "C# .NET 8, PostgreSQL, Redis"
      "{TECH_STACK}"
    architecture_patterns: | # e.g., "Clean Architecture, CQRS"
      "{ARCH_PATTERNS}"

    # For Product Manager:
    user_stories: | # e.g., "5 completed, 3 in progress"
      "{USER_STORIES}"
    stakeholder_feedback: | # e.g., "Positive response to MVP"
      "{STAKEHOLDER_FEEDBACK}"

    # For AI Expert:
    insights_generated: | # e.g., "Identified context saving optimization"
      "{INSIGHTS}"
    recommendations_pending: | # e.g., "Implement structured context saving"
      "{RECOMMENDATIONS}"

  session_context:
    user_interactions:
      - | # e.g., "User requested feature implementation"
        "{INTERACTION_1}"
      - | # e.g., "User approved technical approach"
        "{INTERACTION_2}"

    commands_executed:
      - | # e.g., "!save-context", "!start-workflow"
        "{COMMAND_1}"
      - | # e.g., "!validate", "!handoff"
        "{COMMAND_2}"

    context_restoration_notes:
      - | # e.g., "Continue from authentication implementation"
        "{RESTORATION_NOTE_1}"
      - | # e.g., "Focus on performance optimization"
        "{RESTORATION_NOTE_2}"

# Context Save Guidelines:
# 1. Save context at natural breakpoints (phase completion, handoffs, pauses)
# 2. Include enough detail for seamless continuation
# 3. Update progress and status accurately
# 4. Capture all decisions and blockers
# 5. Maintain quality metrics and timeline context
# 6. Include domain-specific information relevant to the agent type

