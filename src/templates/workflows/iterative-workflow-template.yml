---
# AgentStudio.AI Iterative Workflow Template
# Template for workflows with loops/recursive patterns between agents

version: "1.0.0"
template_type: "iterative_workflow_template"
workflow_name: "{WORKFLOW_NAME}"
created: "2025-01-25"
description: |
  Template for {WORKFLOW_DESCRIPTION} with iterative/recursive patterns

# Template Variables for Iterative Workflows
# {WORKFLOW_NAME} - e.g., "Code Review Cycle", "Design Iteration",
# "Bug Fix Loop"
# {WORKFLOW_DESCRIPTION} - e.g., "Iterative code review and improvement
# workflow"
# {ITERATION_TRIGGER} - e.g., "Review feedback", "Test failures",
# "Performance issues"
# {CONVERGENCE_CRITERIA} - e.g., "All tests pass", "Performance targets met",
# "Review approved"

workflow_definition:
  trigger:
    condition: "{TRIGGER_CONDITION}"
    initiator: "{INITIATOR_ROLE}"

  participants:
    primary_agent: "{PRIMARY_AGENT}"
    review_agent: | # e.g., "Code Reviewer", "Architect", "QA Tester"
      "{REVIEW_AGENT}"
    supporting_agents:
      - "{SUPPORTING_AGENT_1}"
      - "{SUPPORTING_AGENT_2}"

  iteration_loop:
    max_iterations: "{MAX_ITERATIONS}" # e.g., "5", "10", "unlimited"
    convergence_criteria:
      - "{CONVERGENCE_CRITERIA_1}" # e.g., "All tests pass"
      - "{CONVERGENCE_CRITERIA_2}" # e.g., "Performance targets met"
      - "{CONVERGENCE_CRITERIA_3}" # e.g., "Review approved"

    iteration_phases:
      phase_1_work:
        name: | # e.g., "Implementation", "Design", "Analysis"
          "{WORK_PHASE_NAME}"
        responsible_agent: "{WORK_AGENT}"
        deliverables:
          - | # e.g., "Code changes", "Design updates"
            "{WORK_DELIVERABLE_1}"
          - | # e.g., "Test results", "Documentation"
            "{WORK_DELIVERABLE_2}"

      phase_2_review:
        name: | # e.g., "Code Review", "Design Review", "Analysis Review"
          "{REVIEW_PHASE_NAME}"
        responsible_agent: "{REVIEW_AGENT}"
        review_criteria:
          - | # e.g., "Code quality standards"
            "{REVIEW_CRITERIA_1}"
          - | # e.g., "Performance requirements"
            "{REVIEW_CRITERIA_2}"
          - | # e.g., "Security compliance"
            "{REVIEW_CRITERIA_3}"

        feedback_types:
          - | # e.g., "APPROVED", "NEEDS_CHANGES", "REJECTED"
            "{FEEDBACK_TYPE_1}"
          - | # e.g., "MINOR_FIXES", "MAJOR_REWORK", "ARCHITECTURAL_CHANGES"
            "{FEEDBACK_TYPE_2}"

      phase_3_decision:
        name: | # e.g., "Convergence Check", "Quality Gate"
          "{DECISION_PHASE_NAME}"
        decision_logic:
          if_approved: "EXIT_LOOP"
          if_needs_changes: "CONTINUE_LOOP"
          if_rejected: "ESCALATE"

        escalation_path:
          - "{ESCALATION_1}" # e.g., "Notify Product Manager"
          - "{ESCALATION_2}" # e.g., "Notify Architect"

  loop_control:
    iteration_tracking:
      current_iteration: "{CURRENT_ITERATION}"
      iteration_history: | # e.g., "Array of iteration results"
        "{ITERATION_HISTORY}"

    convergence_detection:
      algorithm: | # e.g., "ALL_CRITERIA_MET", "MAJORITY_APPROVAL",
        # "PERFORMANCE_THRESHOLD"
        "{CONVERGENCE_ALGORITHM}"
      timeout_handling: | # e.g., "ESCALATE", "ACCEPT_CURRENT", "REJECT"
        "{TIMEOUT_HANDLING}"

    quality_gates:
      per_iteration:
        - | # e.g., "No regression in tests"
          "{ITERATION_GATE_1}"
        - | # e.g., "Performance not degraded"
          "{ITERATION_GATE_2}"

      final_convergence:
        - | # e.g., "All review criteria met"
          "{FINAL_GATE_1}"
        - | # e.g., "Performance targets achieved"
          "{FINAL_GATE_2}"

  communication_patterns:
    iteration_start: | # e.g., "Formal handoff", "Async notification"
      "{ITERATION_START_PROTOCOL}"
    feedback_delivery: | # e.g., "Structured feedback", "Detailed comments"
      "{FEEDBACK_PROTOCOL}"
    convergence_notification: | # e.g., "Success notification",
      # "Escalation alert"
      "{CONVERGENCE_PROTOCOL}"

workflow_constraints:
  iteration_limits:
    max_iterations: "{MAX_ITERATIONS}"
    timeout_per_iteration: | # e.g., "2 hours", "1 day"
      "{ITERATION_TIMEOUT}"
    total_workflow_timeout: "{TOTAL_TIMEOUT}" # e.g., "1 week", "2 weeks"

  quality_requirements:
    - | # e.g., "No breaking changes"
      "{QUALITY_REQ_1}"
    - | # e.g., "Maintain backward compatibility"
      "{QUALITY_REQ_2}"

  escalation_triggers:
    - | # e.g., "Max iterations exceeded"
      "{ESCALATION_TRIGGER_1}"
    - | # e.g., "Quality degradation detected"
      "{ESCALATION_TRIGGER_2}"

notes: |
  This iterative workflow template supports recursive patterns where agents
  work together in loops until convergence criteria are met. It includes
  proper loop control, convergence detection, and escalation handling to
  prevent infinite loops while ensuring quality outcomes.
