---
# AgentStudio.AI Human Checkpoint Workflow Template
# Template for workflows with human decision points and approvals

version: "1.0.0"
template_type: "human_checkpoint_workflow_template"
workflow_name: "{WORKFLOW_NAME}"
created: "2025-01-25"
description: |
  Template for {WORKFLOW_DESCRIPTION} with human checkpoints and approvals

# Template Variables for Human Checkpoint Workflows
# {WORKFLOW_NAME} - e.g., "Feature Approval", "Architecture Review",
  # "Release Process"
  # {WORKFLOW_DESCRIPTION} - e.g., "Feature development with human approval
  # checkpoints"
  # {HUMAN_ROLE} - e.g., "Product Manager", "Architect", "Release Manager"
  # {APPROVAL_CRITERIA} - e.g., "Business requirements met", "Architecture
  # approved", "Quality gates passed"

workflow_definition:
  trigger:
    condition: "{TRIGGER_CONDITION}"
    initiator: "{INITIATOR_ROLE}"

  participants:
    agents:
      - "{AGENT_1}" # e.g., "Backend Engineer", "Frontend Engineer"
      - "{AGENT_2}" # e.g., "QA Tester", "DevOps Engineer"
    human_stakeholders:
      - "{HUMAN_ROLE_1}" # e.g., "Product Manager", "Architect"
      - "{HUMAN_ROLE_2}" # e.g., "Release Manager", "Security Officer"

  workflow_phases:
    phase_1_preparation:
      name: "{PREP_PHASE_NAME}" # e.g., "Requirements Analysis", "Design Phase"
      responsible_agent: "{PREP_AGENT}"
      deliverables:
        - "{PREP_DELIVERABLE_1}" # e.g., "Requirements document",
          # "Technical design"
        - "{PREP_DELIVERABLE_2}" # e.g., "Acceptance criteria",
          # "Architecture diagram"

      human_checkpoint_1:
        checkpoint_name: "{CHECKPOINT_1_NAME}" # e.g., "Requirements Approval",
          # "Design Approval"
        human_role: "{HUMAN_ROLE_1}"
        approval_criteria:
          - "{APPROVAL_CRITERIA_1}" # e.g., "Requirements complete and clear"
          - "{APPROVAL_CRITERIA_2}" # e.g., "Design aligns with business goals"

        decision_options:
          - "APPROVED" # Continue to next phase
          - "NEEDS_REVISION" # Return to preparation phase
          - "REJECTED" # Terminate workflow

        escalation_path:
          - "{ESCALATION_1}" # e.g., "Notify Director", "Notify CTO"

        timeout_handling:
          timeout_duration: "{TIMEOUT_1}" # e.g., "48 hours", "3 days"
          timeout_action: "{TIMEOUT_ACTION_1}" # e.g., "ESCALATE", "AUTO_APPROVE", "REJECT"

    phase_2_implementation:
      name: "{IMPL_PHASE_NAME}" # e.g., "Implementation", "Development"
      responsible_agent: "{IMPL_AGENT}"
      deliverables:
        - "{IMPL_DELIVERABLE_1}" # e.g., "Working code", "Test results"
        - "{IMPL_DELIVERABLE_2}" # e.g., "Documentation", "Performance metrics"

      human_checkpoint_2:
        checkpoint_name: "{CHECKPOINT_2_NAME}" # e.g., "Implementation Review", "Quality Gate"
        human_role: "{HUMAN_ROLE_2}"
        approval_criteria:
          - "{APPROVAL_CRITERIA_3}" # e.g., "Code quality standards met"
          - "{APPROVAL_CRITERIA_4}" # e.g., "Performance requirements satisfied"

        decision_options:
          - "APPROVED" # Continue to next phase
          - "NEEDS_REVISION" # Return to implementation phase
          - "REJECTED" # Terminate workflow

        timeout_handling:
          timeout_duration: "{TIMEOUT_2}"
          timeout_action: "{TIMEOUT_ACTION_2}"

    phase_3_deployment:
      name: "{DEPLOY_PHASE_NAME}" # e.g., "Deployment", "Release"
      responsible_agent: "{DEPLOY_AGENT}"
      deliverables:
        - "{DEPLOY_DELIVERABLE_1}" # e.g., "Deployed application", "Monitoring setup"
        - "{DEPLOY_DELIVERABLE_2}" # e.g., "Release notes", "Rollback plan"

      human_checkpoint_3:
        checkpoint_name: "{CHECKPOINT_3_NAME}" # e.g., "Release Approval", "Go-Live Decision"
        human_role: "{HUMAN_ROLE_3}"
        approval_criteria:
          - "{APPROVAL_CRITERIA_5}" # e.g., "All tests passed"
          - "{APPROVAL_CRITERIA_6}" # e.g., "Rollback plan verified"

        decision_options:
          - "APPROVED" # Complete workflow
          - "NEEDS_REVISION" # Return to deployment phase
          - "REJECTED" # Terminate workflow

        timeout_handling:
          timeout_duration: "{TIMEOUT_3}"
          timeout_action: "{TIMEOUT_ACTION_3}"

  human_interaction_patterns:
    notification_methods:
      - "{NOTIFICATION_1}" # e.g., "Email", "Slack", "Teams"
      - "{NOTIFICATION_2}" # e.g., "Dashboard", "Mobile app"

    approval_interface:
      interface_type: "{INTERFACE_TYPE}" # e.g., "Web dashboard", "Email response", "API"
      required_actions:
        - "{ACTION_1}" # e.g., "Review deliverables", "Provide feedback"
        - "{ACTION_2}" # e.g., "Approve or reject", "Set conditions"

    feedback_collection:
      feedback_format: "{FEEDBACK_FORMAT}" # e.g., "Structured form", "Free text", "Checklist"
      required_feedback:
        - "{FEEDBACK_1}" # e.g., "Approval decision", "Revision requirements"
        - "{FEEDBACK_2}" # e.g., "Additional conditions", "Risk assessment"

  workflow_control:
    checkpoint_dependencies:
      - "{DEPENDENCY_1}" # e.g., "Checkpoint 2 requires Checkpoint 1 approval"
      - "{DEPENDENCY_2}" # e.g., "Checkpoint 3 requires Checkpoint 2 approval"

    parallel_approvals:
      enabled: "{PARALLEL_ENABLED}" # e.g., "true", "false"
      parallel_checkpoints:
        - "{PARALLEL_CHECKPOINT_1}" # e.g., "Security review", "Performance review"
        - "{PARALLEL_CHECKPOINT_2}" # e.g., "Business review", "Technical review"

    rollback_capability:
      rollback_triggers:
        - "{ROLLBACK_TRIGGER_1}" # e.g., "Human rejection", "Quality failure"
        - "{ROLLBACK_TRIGGER_2}" # e.g., "Timeout exceeded", "Escalation required"

      rollback_actions:
        - "{ROLLBACK_ACTION_1}" # e.g., "Revert to previous phase", "Terminate workflow"
        - "{ROLLBACK_ACTION_2}" # e.g., "Notify stakeholders", "Create incident report"

workflow_constraints:
  human_availability:
    business_hours: "{BUSINESS_HOURS}" # e.g., "9 AM - 5 PM EST", "24/7"
    response_sla: "{RESPONSE_SLA}" # e.g., "24 hours", "48 hours"

  approval_authority:
    - "{AUTHORITY_1}" # e.g., "Product Manager can approve features"
    - "{AUTHORITY_2}" # e.g., "Architect can approve technical changes"

  escalation_matrix:
    - "{ESCALATION_LEVEL_1}" # e.g., "Team Lead", "Manager", "Director"
    - "{ESCALATION_LEVEL_2}" # e.g., "CTO", "VP Engineering", "CEO"

notes: |
  This human checkpoint workflow template supports workflows that require
  human decision points and approvals. It includes proper timeout handling,
  escalation paths, and rollback capabilities to ensure workflows don't
  get stuck waiting for human input while maintaining necessary oversight.
