---
name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install validation tools
        run: |
          # Use cache to speed up package installation
          sudo apt-get update -qq
          sudo apt-get install -y libxml2-utils yamllint
          # Use npm cache and install markdownlint-cli
          npm install -g markdownlint-cli --cache /tmp/.npm
        env:
          # Speed up npm installation
          NPM_CONFIG_PROGRESS: false
          NPM_CONFIG_SPIN: false
          NPM_CONFIG_CACHE: /tmp/.npm

      - name: Make scripts executable
        run: |
          chmod +x scripts/validate.sh

      - name: Build NuGet package
        run: |
          echo "Building NuGet package using dotnet pack..."
          dotnet pack src/AgentStudio.AI.Core.csproj -c Release -o dist/
          echo "Package built successfully!"

      - name: Validate package
        run: |
          echo "Validating package using validate.sh..."
          ./scripts/validate.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: dist/
          retention-days: 7

  release:
    needs: build-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: dist/

      - name: Publish to NuGet
        run: |
          echo "Publishing to NuGet..."
          # Add NuGet publishing commands here
          # This will be implemented when ready for public release
